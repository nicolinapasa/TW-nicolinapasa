<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universități din România</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/universities_style.css">
</head>

<body>

    <div class="app">

        <header class="app-header">
            <h1>Universități din România</h1>

            <div class="controls">
                <input
                    type="text"
                    id="q"
                    placeholder="caută după nume..."
                >
                <button id="exportBtn">Export CSV</button>
            </div>

            <div id="status" class="status"></div>
        </header>

        <main class="app-body">
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th class="col-name">Nume</th>
                            <th class="col-country">Țara</th>
                            <th class="col-site">Site</th>
                        </tr>
                    </thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
        </main>

    </div>

    <script src="../js/universities_js.js"></script>

</body>

</html>
