
<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    {% load static %}

    <link rel="stylesheet" href="{% static 'CSS/meals_style.css' %}">

    <title>Căutare rețete</title>
</head>

<body>

    <header>
        <nav>
            <ul>
                <li><a href="{% url 'home' %}">Acasă</a></li>
                <li><a href="{% url 'chatbot' %}">Chatbot</a></li>
                <li><a href="{% url 'universities' %}">Universități</a></li>
                <li><a href="{% url 'meals' %}">Rețete</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <h1>Caută rețete culinare</h1>

        <p>Descoperă rețete delicioase cu ajutorul TheMealDB!</p>

        <!-- Search area -->
        <form id="searchForm">
            <input
                id="queryInput"
                type="text"
                placeholder="Caută o rețetă (ex: pasta, pizza)...">

            <button id="searchBtn" type="submit">
                Caută
            </button>
        </form>

        <p id="status" aria-live="polite"></p>

        <div id="results"></div>

    </main>

    <footer>
        <p>&copy; 2026 Comunitatea de Tehnologii Web</p>
    </footer>

    <script src="{% static 'JS/meals.js' %}"></script>

</body>

</html>
