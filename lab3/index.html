<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Lab</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <nav>
        <div class="brand">Laborator 3</div>

    </nav>
</header>

<main>

    <section id="selectors">
        <h2>Selectors</h2>

        <p class="important">
            An important paragraph
        </p>
    </section>

    <section id="box-model">
        <h2>Box Model</h2>

        <div class="cards">
            <div class="card-a">
                <h3>Card A</h3>
                <p>content-box</p>
            </div>

            <div class="card-b">
                <h3>Card B</h3>
                <p>border-box</p>
            </div>
        </div>
    </section>

    <section id="gallery">
        <h2>Grid Gallery</h2>

        <div class="gallery">
            <div class="gallery-card">Card 1</div>
            <div class="gallery-card">Card 2</div>
            <div class="gallery-card">Card 3</div>
            <div class="gallery-card">Card 4</div>
            <div class="gallery-card">Card 5</div>
            <div class="gallery-card">Card 6</div>
        </div>
    </section>

    <section>
        <h2>Responsive Layout</h2>

        <div class="layout">
            <aside>
                <h3>Sidebar</h3>
                <p>Sidebar content</p>
            </aside>

            <article>
                <h3>Main Content</h3>
                <p>
                    IMPORTANT PARAGRAPH
                </p>
            </article>
        </div>
    </section>

</main>

<footer>
    <p>Laborator 3</p>
</footer>

</body>
</html>
